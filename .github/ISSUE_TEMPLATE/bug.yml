name: Помилка програми / Bug
description: Програма поводиться не так, як очікувалось
labels: [bug]
body:
  - type: input
    id: env
    attributes:
      label: ОС і браузер / OS and browser
      placeholder: Windows 11, Edge 140
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Кроки / Steps
      placeholder: "1. Відкрив trina435-manual24.json\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Очікувано і фактично / Expected and actual
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: Project JSON (мінімальний, без клієнтських даних) / minimal project JSON
      render: json
