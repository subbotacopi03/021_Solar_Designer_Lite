name: Розбіжність розрахунку / Calculation mismatch
description: Ручний розрахунок не збігається з результатом програми
labels: [calculation]
body:
  - type: input
    id: check
    attributes:
      label: Перевірка (ID) / Check ID
      placeholder: s1:VOC_DC
    validations:
      required: true
  - type: textarea
    id: hand
    attributes:
      label: Ваш розрахунок з формулою й одиницями / Your calculation with formula and units
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: Результат програми / Program result
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Джерело формули або вхідних даних / Formula or input source
  - type: textarea
    id: project
    attributes:
      label: Project JSON
      render: json
    validations:
      required: true
