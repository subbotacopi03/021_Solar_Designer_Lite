name: Дані обладнання / Equipment data
description: Додати або виправити модуль, інвертор, кабель чи апарат захисту
labels: [equipment-data]
body:
  - type: input
    id: sku
    attributes:
      label: Виробник і точний SKU / Manufacturer and exact SKU
      placeholder: Trina Solar TSM-435NEG9R.28
    validations:
      required: true
  - type: input
    id: datasheet
    attributes:
      label: Офіційний datasheet (URL, редакція, дата) / Official datasheet (URL, revision, date)
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Параметри з одиницями й сторінкою/таблицею / Values with units and page/table
      description: Невідомі поля залиште порожніми — не підставляйте типові значення. Без цін.
    validations:
      required: true
