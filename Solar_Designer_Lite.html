<section class="panel handbook">
<h2>Довідник проєктувальника СЕС</h2>
<p class="subtitle">Коротка лекція: обладнання, як його вибирати і які бувають сонячні станції. Орієнтовні діапазони значень наведено для розуміння; у розрахунках використовуйте лише дані конкретного datasheet і умови конкретного об'єкта.</p>

<h3 id="hb-1">1. Як працює сонячна станція</h3>
<p>Модулі перетворюють сонячне випромінювання на постійний струм. Модулі з'єднують послідовно в стрінги, щоб отримати робочу напругу інвертора. Інвертор шукає точку максимальної потужності (MPPT) і перетворює постійний струм на змінний, синхронний з мережею. Між ними — комутація й захист з обох боків: DC і AC.</p>

<tr><td>BC / IBC (контакти ззаду)</td><td>22.5–24 %</td><td>−0.26…−0.29</td><td>Без шин спереду, естетика й ККД; дорожчі.</td></tr>
<tr><td>Тонкоплівкові (CdTe)</td><td>18–19 %</td><td>≈ −0.28</td><td>Великі наземні СЕС; інша вольт-амперна характеристика й напруги.</td></tr>
</tbody></table></div>
<h4>Конструкція</h4>
<ul><li><b>Half-cut</b> — елементи розрізані навпіл, дві паралельні половини модуля: менші втрати й краща поведінка при частковому затіненні.</li><li><b>Glass-glass / біфаціальні</b> — скло з двох боків, задня сторона генерує від відбитого світла (альбедо). Приріст 5–15 % на світлій поверхні й високому монтажі; на даху впритул — майже нуль.</li><li><b>Рамка й розмір</b> — модулі 2.0–2.4 м і 25–35 кг: перевіряйте вітрове/снігове навантаження за інструкцією монтажу виробника і точки кріплення.</li></ul>
${Pl}
<h4>Що брати з datasheet і навіщо</h4>
<div class="table-wrap"><table><thead><tr><th>Параметр</th><th>Для чого в проєкті</th></tr></thead><tbody>
<tr><td>Pmax, допуск (0…+5 W)</td><td>Встановлена потужність DC, DC/AC.</td></tr>
<tr><td>Voc, βVoc</td><td>Максимальна напруга стрінгу на морозі: не перевищити Vdc max інвертора і Vsys модуля.</td></tr>
<tr><td>Vmp, βVmp</td><td>Робоча напруга: на спеку не впасти нижче Vmin MPPT, на морозі не вийти за Vmax MPPT.</td></tr>
<tr><td>Isc, Imp, αIsc</td><td>Струм на вхід/MPPT інвертора, переріз кабелю, запобіжники.</td></tr>
<tr><td>Max system voltage (1000/1500 V)</td><td>Ізоляція модуля — верхня межа стрінгу разом з інвертором.</td></tr>
<tr><td>Max series fuse</td><td>Номінал стрінгового запобіжника; не плутати зі стійкістю до зворотного струму.</td></tr>
<tr><td>NMOT/NOCT, γPmax</td><td>Нагрів модуля і втрати потужності в спеку.</td></tr>
<tr><td>Деградація, гарантія</td><td>Перший рік ~1–2 %, далі ~0.4 %/рік; гарантія потужності 25–30 років.</td></tr>
</tbody></table></div>
<p><b>Як вибирати:</b> n-type (TOPCon/HJT) для нових проєктів; біфаціальні — для наземних і плоских дахів з високим монтажем; на дах з обмеженою площею — вища потужність з м²; перевіряйте наявність повного datasheet (обидва температурні коефіцієнти напруги), сертифікати IEC 61215/61730 і дистриб'ютора з гарантійним обслуговуванням в Україні.</p>

<h3 id="hb-3">3. Інвертори</h3>
<div class="table-wrap"><table><thead><tr><th>Тип</th><th>Потужність</th><th>Де застосовують</th></tr></thead><tbody>
<tr><td>Мережевий стрінговий</td><td>3–350 kW</td><td>Дахи, комерційні й наземні СЕС; кілька MPPT, легко резервувати.</td></tr>
<tr><td>Центральний</td><td>від 1 MW</td><td>Великі наземні СЕС з однорідним масивом, окремі DC-комбайнер бокси.</td></tr>
<tr><td>Гібридний</td><td>3–100 kW</td><td>Мережа + АКБ + резервна лінія; приватні будинки, бізнес з відключеннями.</td></tr>
<tr><td>Автономний (off-grid)</td><td>1–15 kW</td><td>Без мережі; часто з входом генератора.</td></tr>
<tr><td>Мікроінвертор</td><td>0.3–2 kW</td><td>Складні дахи з тінню й різною орієнтацією, малі системи.</td></tr>
</tbody></table></div>
<h4>Ключові параметри й правила стрінгування</h4>
<ul><li><b>Vdc max</b> — абсолютна межа: N × Voc(Tmin) ≤ Vdc max і ≤ Vsys модуля.</li><li><b>Вікно MPPT</b> (Vmin…Vmax): N × Vmp(Tmax) ≥ Vmin; N × Vmp(Tmin) ≤ Vmax. Номінальна напруга — орієнтир для найкращого ККД.</li><li><b>Струм на MPPT і на фізичний вхід</b> — окремі межі: Imp і Isc стрінгів на трекері не мають перевищувати паспортні значення. Межу трекера не можна ділити на кількість входів.</li><li><b>Кількість MPPT</b> — кожна площина з іншою орієнтацією/нахилом на окремий MPPT; паралельні стрінги одного MPPT — однакової довжини.</li><li><b>DC/AC</b> — типово 1.1–1.3 залежно від орієнтації й клімату; верхня межа — max DC power інвертора.</li><li><b>Фази й напруга</b> — 1 фаза зазвичай до 5–6 kW, далі 3 фази; вимоги до приєднання — за умовами оператора мережі.</li></ul>
<p>Формула напруги від температури: <b>Voc(T) = Voc · [1 + βVoc/100 · (T − 25)]</b>, аналогічно Vmp з βVmp. Tmin комірки ≈ мінімальна температура повітря на місці (на світанку модуль не прогрітий); Tmax комірки ≈ повітря + 25…35 °C. Ці значення вводяться явно в розділі «Умови й кабелі».</p>
${Fl}

<h3 id="hb-4">4. Оптимізатори й мікроінвертори</h3>
${Il}
<ul><li><b>Оптимізатор</b> — DC/DC перетворювач на модулі з власним MPPT. Виправданий при частковому затіненні, кількох орієнтаціях на одному стрінгу, потребі в помодульному моніторингу або швидкому відключенні на даху. Повноцінна система (наприклад, з фіксованою напругою стрінгу) працює лише з інвертором того самого виробника; правила довжини стрінгу задає виробник, а не формула Voc × N.</li><li><b>Мікроінвертор</b> — без високої DC напруги на даху, кожен модуль незалежний. Мінуси: багато електроніки на даху, складніший ремонт, вища ціна за kW.</li><li>Без тіні й з однією орієнтацією стрінговий інвертор простіший і надійніший.</li></ul>
<p class="banner info">У цій версії програми топологія з оптимізаторами не розраховується: результат буде UNKNOWN.</p>

<h3 id="hb-5">5. Акумулятори (BESS)</h3>
<div class="table-wrap"><table><thead><tr><th>Хімія</th><th>Циклів, орієнтовно</th><th>Глибина розряду</th><th>Коментар</th></tr></thead><tbody>
<tr><td>LiFePO₄ (LFP)</td><td>6000+</td><td>90–100 %</td><td>Стандарт для СЕС: термічно стабільна, довгий ресурс.</td></tr>
<tr><td>NMC</td><td>3000–5000</td><td>90 %</td><td>Вища щільність енергії, вимогливіша до температури й захисту.</td></tr>
<tr><td>Свинцево-кислотні AGM/GEL</td><td>500–1500</td><td>50 %</td><td>Дешеві на старті, важкі, короткий ресурс; лише для малих автономних систем.</td></tr>
</tbody></table></div>
<ul><li><b>Низьковольтні 48 V</b> — модулі паралельно, великі струми, товсті кабелі; до ~15–20 kWh. <b>Високовольтні 150–800 V</b> — модулі послідовно в стійці, менші струми, для гібридів від 8–10 kW.</li><li><b>Що перевіряти:</b> вікно напруги батареї в межах батарейного порту інвертора, тривалий струм/потужність заряду-розряду (C-rate), корисна ємність (не номінальна), робочий діапазон температур (заряд нижче 0 °C зазвичай заборонений без підігріву), BMS-сумісність — лише за офіційним списком сумісності виробника інвертора.</li><li><b>Розмір:</b> автономні й резервні — від енергії споживачів за потрібний час (E = P × t з урахуванням DoD і ККД); для самоспоживання — від нічного споживання.</li></ul>

<h3 id="hb-6">6. Кабелі та захист</h3>
<ul><li><b>DC кабель</b> — спеціальний PV кабель (H1Z2Z2-K за EN 50618), 4–6 мм², стійкий до УФ; плюс і мінус стрінгу поруч, щоб зменшити петлю (наведення від блискавки).</li><li><b>Конектори</b> — MC4-сумісні однієї моделі й виробника в парі; змішування різних виробників — типова причина оплавлення.</li><li><b>Падіння напруги</b> — ΔU залежить від струму, довжини і R(T) провідника при робочій температурі; ліміт задається політикою проєкту (орієнтир DC ~1 %, AC 1–3 %).</li><li><b>Стрінгові запобіжники gPV</b> — потрібні, коли при замиканні в одному стрінгу сума струмів паралельних стрінгів може перевищити допустимий для модуля (зазвичай від трьох паралельних стрінгів). Номінал — між струмом стрінгу з запасом і Max series fuse модуля.</li><li><b>DC роз'єднувач</b> — категорія DC-PV, номінальна напруга й струм для потрібної схеми полюсів; не плутати Ui/Ith з робочими Ue/Ie.</li><li><b>SPD (ПЗІП)</b> — Тип 2 на DC і AC як базовий; Тип 1, якщо є зовнішня блискавкозахисна система й не витримана розділювальна відстань. DC SPD — з напругою Ucpv не нижче максимальної Voc масиву.</li><li><b>AC сторона</b> — автомат за струмом інвертора, ПЗВ — тип і уставка за інструкцією виробника інвертора, заземлення й вирівнювання потенціалів рам.</li></ul>

<h3 id="hb-7">7. Які бувають сонячні станції</h3>
${Ll}
<div class="table-wrap"><table><thead><tr><th>За розміщенням</th><th>Особливості проєктування</th></tr></thead><tbody>
<tr><td>Скатний дах</td><td>Кріплення на гаки/шпильки, орієнтація даху; перевірка несучої здатності, пожежні проходи, тіні від димарів.</td></tr>
<tr><td>Плаский дах</td><td>Баластні системи або анкерування, кут 10–15°, крок рядів від тіні; навантаження на покрівлю.</td></tr>
<tr><td>Наземна</td><td>Палі/гвинтові опори, геологія, ряди з кроком від висоти сонця взимку; довгі DC/AC лінії, заземлення поля.</td></tr>
<tr><td>Трекерна</td><td>Одновісні трекери: +15–25 % генерації, ряди з урахуванням повороту, привід і обслуговування.</td></tr>
<tr><td>Навіси (carport), фасад (BIPV)</td><td>Конструкція — частина будівлі; естетика, вертикальні площини з меншою генерацією.</td></tr>
<tr><td>Агро- та плавучі</td><td>Висота й крок під техніку/рослини; для плавучих — понтони, кабелі у воді, корозія.</td></tr>
</tbody></table></div>
<p><b>Орієнтація:</b> південь дає максимум за рік; схід–захід — рівніший добовий графік і більше модулів на плоскому даху. Кут нахилу для максимуму за рік в Україні — близько 30–40°.</p>

<h3 id="hb-8">8. Порядок проєктування і де це в програмі</h3>
<ol class="hb-steps"><li>Дані об'єкта: місце, площі, орієнтація, тіні, мінімальна/максимальна температура, точка приєднання й вимоги мережі.</li><li>Модуль і інвертор з повними datasheet — розділ «Обладнання».</li><li>Площини й кількість модулів — «Огляд».</li><li>Температури, cos φ, траси кабелів, знижувальні коефіцієнти — «Умови й кабелі».</li><li>Діапазон стрінгу Nmin…Nmax і розподіл по MPPT — «Стрінги та MPPT».</li><li>Перевірки FAIL/UNKNOWN і що уточнити — «Перевірки».</li><li>Звіт і специфікація — «Звіт і BOM»; збережіть JSON проєкту.</li><li>Після попереднього розрахунку — захист, заземлення, блискавкозахист, кріплення й погодження з оператором мережі за чинними нормами.</li></ol>
